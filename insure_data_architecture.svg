  <text x="890" y="108" text-anchor="middle" font-size="10" font-weight="600" fill="#29B5E8">Powered by Snowflake</text>

  <!-- Footer -->
  <text x="500" y="812" text-anchor="middle" font-size="9" fill="#CBD5E1">dbt 4-Layer Medallion · Dynamic Tables · Cortex AI/ML · Streams+Tasks · RBAC/RLS · Data Masking</text>
</svg>