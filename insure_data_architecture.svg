  <line x1="500" y1="178" x2="500" y2="218" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="780" y1="178" x2="620" y2="240" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- ===== RAW LAYER ===== -->
  <g filter="url(#shadowDeep)">
    <rect x="310" y="218" width="380" height="64" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="310" y="218" width="380" height="30" rx="12" fill="url(#gradRaw)"/>
    <rect x="310" y="236" width="380" height="12" fill="url(#gradRaw)"/>
    <text x="500" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="white">RAW LAYER</text>
    <text x="500" y="265" text-anchor="middle" font-size="11" fill="#475569">GRANDATA.ASSET_INCOME_INFO  ·  PUBLIC_DATA_*</text>
  </g>

  <!-- Arrow annotation -->
  <line x1="500" y1="282" x2="500" y2="316" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <rect x="530" y="288" width="140" height="18" rx="4" fill="#F1F5F9"/>
  <text x="600" y="301" text-anchor="middle" font-size="9" fill="#64748B">컬럼 정규화 · 단위 변환</text>

  <!-- ===== STAGING LAYER ===== -->
  <g filter="url(#shadowDeep)">
    <rect x="190" y="316" width="620" height="76" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="190" y="316" width="620" height="30" rx="12" fill="url(#gradStg)"/>
    <rect x="190" y="334" width="620" height="12" fill="url(#gradStg)"/>
