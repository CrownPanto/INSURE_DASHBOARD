<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif">
  <defs>
    <!-- Shadows -->
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
    <filter id="shadowDeep" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000020"/>
    </filter>
    <!-- Gradients -->
    <linearGradient id="gradRaw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="gradStg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="gradInt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="gradMart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="gradStream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="gradRAG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="gradSource" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <!-- Arrow marker -->
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#14B8A6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="820" rx="16" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">INSURE 데이터 아키텍처</text>
  <text x="500" y="64" text-anchor="middle" font-size="12" fill="#64748B">Team CrownPanto · Snowflake Hackathon 2026 — "INSURE, For Sure."</text>

  <!-- Layer labels (left side) -->
  <text x="30" y="147" font-size="10" font-weight="600" fill="#94A3B8" transform="rotate(-90 30 147)">DATA SOURCE</text>
  <text x="30" y="290" font-size="10" font-weight="600" fill="#94A3B8" transform="rotate(-90 30 290)">RAW</text>
  <text x="30" y="388" font-size="10" font-weight="600" fill="#94A3B8" transform="rotate(-90 30 388)">STAGING</text>
  <text x="30" y="493" font-size="10" font-weight="600" fill="#94A3B8" transform="rotate(-90 30 493)">INTERMEDIATE</text>
  <text x="30" y="598" font-size="10" font-weight="600" fill="#94A3B8" transform="rotate(-90 30 598)">MART</text>
  <text x="30" y="730" font-size="10" font-weight="600" fill="#94A3B8" transform="rotate(-90 30 730)">APPLICATION</text>

  <!-- Dashed layer separators -->
  <line x1="50" y1="195" x2="960" y2="195" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="50" y1="298" x2="960" y2="298" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="50" y1="408" x2="960" y2="408" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="50" y1="530" x2="960" y2="530" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="50" y1="655" x2="960" y2="655" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- ===== DATA SOURCES ===== -->
  <!-- GRANDATA -->
  <g filter="url(#shadow)">
    <rect x="120" y="90" width="200" height="88" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="120" y="90" width="200" height="32" rx="12" fill="url(#gradSource)"/>
    <rect x="120" y="110" width="200" height="12" fill="url(#gradSource)"/>
    <text x="220" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="white">GRANDATA API</text>
    <text x="220" y="142" text-anchor="middle" font-size="11" fill="#475569">Marketplace 인구통계</text>
    <text x="220" y="162" text-anchor="middle" font-size="10" fill="#94A3B8">서울 269K rows</text>
  </g>

  <!-- Public Data -->
  <g filter="url(#shadow)">
    <rect x="400" y="90" width="200" height="88" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="400" y="90" width="200" height="32" rx="12" fill="url(#gradSource)"/>
    <rect x="400" y="110" width="200" height="12" fill="url(#gradSource)"/>
    <text x="500" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="white">공공데이터 API</text>
    <text x="500" y="142" text-anchor="middle" font-size="11" fill="#475569">화재 · CCTV · 도난 · 침수</text>
    <text x="500" y="162" text-anchor="middle" font-size="10" fill="#94A3B8">서울시 25개 구</text>
  </g>

  <!-- Ajungdang -->
  <g filter="url(#shadow)">
    <rect x="680" y="90" width="200" height="88" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="680" y="90" width="200" height="32" rx="12" fill="url(#gradSource)"/>
    <rect x="680" y="110" width="200" height="12" fill="url(#gradSource)"/>
    <text x="780" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="white">아정당 Marketplace</text>
    <text x="780" y="142" text-anchor="middle" font-size="11" fill="#475569">아파트 실거래 · 건물정보</text>
    <text x="780" y="162" text-anchor="middle" font-size="10" fill="#94A3B8">Snowflake Marketplace</text>
  </g>

