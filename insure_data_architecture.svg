    <rect x="255" y="470" width="230" height="28" rx="6" fill="#F0F9FF"/>
    <text x="370" y="488" text-anchor="middle" font-size="10" fill="#0EA5E9">INT_SEGMENT_CLASSIFICATION</text>
    <text x="370" y="502" text-anchor="middle" font-size="8" fill="#94A3B8">10개 페르소나 × 25개 구</text>
    <rect x="510" y="470" width="235" height="28" rx="6" fill="#F0F9FF"/>
    <text x="628" y="488" text-anchor="middle" font-size="10" fill="#0EA5E9">INT_DISTRICT_RISK_SCORE</text>
    <text x="628" y="502" text-anchor="middle" font-size="8" fill="#94A3B8">화재·도난·침수·CCTV 가중</text>
  </g>

  <!-- Arrow -->
  <line x1="500" y1="514" x2="500" y2="550" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <rect x="530" y="522" width="200" height="18" rx="4" fill="#F1F5F9"/>
  <text x="630" y="535" text-anchor="middle" font-size="9" fill="#64748B">7단계 보험료 산출 엔진</text>

