    <text x="295" y="374" text-anchor="middle" font-size="10" fill="#3B82F6">STG_ASSET_INCOME</text>
    <rect x="395" y="358" width="190" height="24" rx="6" fill="#EFF6FF"/>
    <text x="490" y="374" text-anchor="middle" font-size="10" fill="#3B82F6">STG_DISTRICT_MASTER</text>
    <rect x="600" y="358" width="190" height="24" rx="6" fill="#EFF6FF"/>
    <text x="695" y="374" text-anchor="middle" font-size="10" fill="#3B82F6">STG_APT_PRICE</text>
