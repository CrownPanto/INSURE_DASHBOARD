  <g filter="url(#shadowDeep)">
    <rect x="230" y="550" width="540" height="90" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="230" y="550" width="540" height="30" rx="12" fill="url(#gradMart)"/>
    <rect x="230" y="568" width="540" height="12" fill="url(#gradMart)"/>
    <text x="500" y="572" text-anchor="middle" font-size="13" font-weight="600" fill="white">MART LAYER</text>
    <rect x="255" y="594" width="230" height="28" rx="6" fill="#F0FDF4"/>
    <text x="370" y="612" text-anchor="middle" font-size="10" fill="#14B8A6">MART_INSURANCE_DESIGN</text>
    <text x="370" y="625" text-anchor="middle" font-size="8" fill="#94A3B8">6개 자산 카테고리 보험료</text>
    <rect x="510" y="594" width="240" height="28" rx="6" fill="#F0FDF4"/>
    <text x="630" y="612" text-anchor="middle" font-size="10" fill="#14B8A6">MART_DISTRICT_INS_SUMMARY</text>
    <text x="630" y="625" text-anchor="middle" font-size="8" fill="#94A3B8">25구 × 60개월 완전 커버</text>
  </g>

  <!-- Arrows: MART → Applications -->
  <line x1="400" y1="640" x2="310" y2="680" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="600" y1="640" x2="700" y2="680" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGray)"/>

