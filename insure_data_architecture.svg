    <rect x="100" y="680" width="360" height="30" rx="12" fill="url(#gradStream)"/>
    <rect x="100" y="698" width="360" height="12" fill="url(#gradStream)"/>
    <text x="280" y="700" text-anchor="middle" font-size="13" font-weight="600" fill="white">STREAMLIT DASHBOARD (5 Pages)</text>
    <!-- Page chips -->
    <rect x="118" y="722" width="100" height="22" rx="6" fill="#FFFBEB"/>
    <text x="168" y="737" text-anchor="middle" font-size="9" fill="#D97706">P1 보험료 지도</text>
    <rect x="226" y="722" width="100" height="22" rx="6" fill="#FFFBEB"/>
    <text x="276" y="737" text-anchor="middle" font-size="9" fill="#D97706">P2 시뮬레이터</text>
    <rect x="334" y="722" width="108" height="22" rx="6" fill="#FFFBEB"/>
    <text x="388" y="737" text-anchor="middle" font-size="9" fill="#D97706">P3 AI 상담</text>

    <rect x="118" y="752" width="100" height="22" rx="6" fill="#FFFBEB"/>
    <text x="168" y="767" text-anchor="middle" font-size="9" fill="#D97706">P4 엔진 상세</text>
    <rect x="226" y="752" width="110" height="22" rx="6" fill="#FFFBEB"/>
    <text x="281" y="767" text-anchor="middle" font-size="9" fill="#D97706">P5 시스템 현황</text>

    <text x="370" y="767" font-size="8" fill="#94A3B8">Plotly · GeoJSON</text>
  </g>

  <!-- Cortex RAG -->
  <g filter="url(#shadowDeep)">
    <rect x="540" y="680" width="360" height="118" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="540" y="680" width="360" height="30" rx="12" fill="url(#gradRAG)"/>
    <rect x="540" y="698" width="360" height="12" fill="url(#gradRAG)"/>
    <text x="720" y="700" text-anchor="middle" font-size="13" font-weight="600" fill="white">CORTEX AI / RAG</text>

    <rect x="560" y="722" width="150" height="28" rx="6" fill="#FDF2F8"/>
    <text x="635" y="738" text-anchor="middle" font-size="9" fill="#EC4899">Plain RAG</text>
    <text x="635" y="748" text-anchor="middle" font-size="7" fill="#94A3B8">367청크 · EMBED_768</text>

    <rect x="722" y="722" width="158" height="28" rx="6" fill="#FDF2F8"/>
    <text x="801" y="738" text-anchor="middle" font-size="9" fill="#EC4899">Graph RAG</text>
    <text x="801" y="748" text-anchor="middle" font-size="7" fill="#94A3B8">31노드 · 34엣지 · BFS</text>

    <rect x="560" y="758" width="320" height="28" rx="6" fill="#FDF2F8"/>
    <text x="720" y="776" text-anchor="middle" font-size="9" fill="#EC4899">SP_ASK_INSURE_ADVISOR · Cortex Search · Cortex LLM</text>
  </g>

  <!-- Bidirectional arrow between Dashboard and RAG -->
  <line x1="460" y1="740" x2="540" y2="740" stroke="#14B8A6" stroke-width="2" stroke-dasharray="6 3"/>
  <polygon points="540,740 532,736 532,744" fill="#14B8A6"/>
  <polygon points="460,740 468,736 468,744" fill="#14B8A6"/>

  <!-- 7-step engine annotation (right side) -->
  <g>
    <rect x="800" y="428" width="170" height="186" rx="10" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1"/>
    <text x="885" y="448" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">7단계 보험료 엔진</text>
    <line x1="810" y1="455" x2="960" y2="455" stroke="#E2E8F0"/>
    <text x="818" y="472" font-size="9" fill="#6366F1">❶ Pure Premium</text>
    <text x="818" y="488" font-size="9" fill="#3B82F6">❷ Experience Adj.</text>
    <text x="818" y="504" font-size="9" fill="#0EA5E9">❸ Risk Loading</text>
    <text x="818" y="520" font-size="9" fill="#14B8A6">❹ Expense Loading</text>
    <text x="818" y="536" font-size="9" fill="#F59E0B">❺ Credibility Blend</text>
    <text x="818" y="552" font-size="9" fill="#EF4444">❻ Segment Factor</text>
    <text x="818" y="568" font-size="9" fill="#8B5CF6">❼ Rate Capping</text>
    <line x1="770" y1="500" x2="800" y2="500" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 2"/>
  </g>

  <!-- Snowflake badge -->
